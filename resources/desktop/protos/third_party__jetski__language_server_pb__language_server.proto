    JAVASCRIPT_EXECUTION_POLICY_DISABLED = 1;
    JAVASCRIPT_EXECUTION_POLICY_REQUEST_REVIEW = 2;
    JAVASCRIPT_EXECUTION_POLICY_NOT_ENFORCED = 3;
  }
  message AgentControls {
    enum FileAccessPolicy {
      FILE_ACCESS_POLICY_UNSPECIFIED = 0;
      FILE_ACCESS_POLICY_DENY = 1;
      FILE_ACCESS_POLICY_ALWAYS_ASK = 2;
      FILE_ACCESS_POLICY_NOT_ENFORCED = 3;
    }
    enum TerminalCommandAutoExecutionPolicy {
      TERMINAL_COMMAND_AUTO_EXECUTION_POLICY_UNSPECIFIED = 0;
      TERMINAL_COMMAND_AUTO_EXECUTION_POLICY_REQUIRE_REVIEW = 1;
      TERMINAL_COMMAND_AUTO_EXECUTION_POLICY_PROCEED_IN_SANDBOX = 2;
      TERMINAL_COMMAND_AUTO_EXECUTION_POLICY_NOT_ENFORCED = 3;
    }
    bool sandbox_mode_enabled = 1;
    .exa.language_server_pb.FetchAdminControlsResponse.AgentControls.FileAccessPolicy outside_workspace_file_access_policy = 2;
    .exa.language_server_pb.FetchAdminControlsResponse.AgentControls.TerminalCommandAutoExecutionPolicy terminal_command_auto_execution_policy = 3;
    bool permission_preset_locked = 4;
  }
  message BrowserControls {
    bool browser_enabled = 1;
    .exa.language_server_pb.FetchAdminControlsResponse.JavascriptExecutionPolicy javascript_execution_policy = 2;
    repeated string actuation_allowed_urls = 3;
  }
  message McpControls {
    bool mcp_enabled = 1;
    .google.protobuf.Struct mcp_allowlist = 2;
  }
  message FeatureControls {
    message MultiagentControls {
      bool boost_command_disabled = 1;
      bool teamwork_preview_command_disabled = 2;
    }
    .exa.language_server_pb.FetchAdminControlsResponse.FeatureControls.MultiagentControls multiagent_controls = 1;
    bool remote_control_enabled = 2;
  }
  message PluginControls {
    bool plugins_disabled = 1;
    bool marketplace_disabled = 2;
  }
  bool admin_controls_applicable = 1;
  .exa.language_server_pb.FetchAdminControlsResponse.AgentControls agent_controls = 2;
  .exa.language_server_pb.FetchAdminControlsResponse.BrowserControls browser_controls = 3;
  .exa.language_server_pb.FetchAdminControlsResponse.McpControls mcp_controls = 4;
  .exa.language_server_pb.FetchAdminControlsResponse.FeatureControls feature_controls = 5;
  .exa.language_server_pb.FetchAdminControlsResponse.PluginControls plugin_controls = 6;
}
