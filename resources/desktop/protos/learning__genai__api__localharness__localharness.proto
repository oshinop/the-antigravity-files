    DECISION_UNSPECIFIED = 0;
    ALLOW = 1;
    DENY = 2;
  }
  .antigravity.localharness.PreToolResult.Decision decision = 1;
  string reason = 2;
  .genai.Struct modified_args = 4;
}
message PreTurnResult {
  enum Decision {
    DECISION_UNSPECIFIED = 0;
    ALLOW = 1;
    DENY = 2;
  }
  .antigravity.localharness.PreTurnResult.Decision decision = 1;
  string reason = 2;
}
message StopResult {
  enum Decision {
    DECISION_UNSPECIFIED = 0;
    ALLOW_STOP = 1;
    CONTINUE = 2;
  }
  .antigravity.localharness.StopResult.Decision decision = 1;
  string reason = 2;
}
