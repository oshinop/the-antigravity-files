  .antigravity.localharness.ToolResponse tool_response = 2;
}
message ActionSkillLookup {
  enum Operation {
    OPERATION_UNSPECIFIED = 0;
    OPERATION_LIST_SKILLS = 1;
    OPERATION_LOOKUP_SKILLS = 2;
    OPERATION_GET_SKILL_RESOURCES = 3;
  }
  .antigravity.localharness.ActionSkillLookup.Operation operation = 1;
  repeated string requested_skill_names = 2;
  repeated string resolved_skill_names = 3;
  string error_message = 4;
}
message ActionRunWorkflow {
  string script_path = 1;
  string description = 2;
  string output = 3;
  string script = 4;
}
message CallHookRequest {
  string request_id = 1;
  string name = 2;
  .antigravity.localharness.LifecycleHook type = 7;
  string client_id = 11;
  .third_party.jetski_prod.localharness.environment.remote.HookOptions hook_options = 12;
  .antigravity.localharness.PreTurnArgs pre_turn_args = 3; // oneof=args
  .antigravity.localharness.PostTurnArgs post_turn_args = 4; // oneof=args
  .antigravity.localharness.PreToolArgs pre_tool_args = 5; // oneof=args
  .antigravity.localharness.PostToolArgs post_tool_args = 6; // oneof=args
  .antigravity.localharness.OnToolErrorArgs on_tool_error_args = 8; // oneof=args
  .antigravity.localharness.OnCompactionArgs on_compaction_args = 9; // oneof=args
  .antigravity.localharness.StopArgs stop_args = 10; // oneof=args
  .antigravity.localharness.IdleArgs idle_args = 13; // oneof=args
}
message CallHookResponse {
  string request_id = 1;
  .antigravity.localharness.PreTurnResult pre_turn_result = 2; // oneof=result
  .antigravity.localharness.PreToolResult pre_tool_result = 3; // oneof=result
  .antigravity.localharness.EmptyResult empty_result = 4; // oneof=result
  string error_message = 5; // oneof=result
  .antigravity.localharness.OnToolErrorResult on_tool_error_result = 6; // oneof=result
  .antigravity.localharness.StopResult stop_result = 7; // oneof=result
}
message PreToolArgs {
  string tool_name = 1;
  string arguments_json = 2;
  string server_name = 3;
  string call_id = 4;
  string trajectory_id = 5;
  uint32 step_index = 6;
}
message PostToolArgs {
  string tool_name = 1;
  string result = 2;
  string error = 3;
  string server_name = 5;
  string call_id = 6;
  string trajectory_id = 7;
  uint32 step_index = 8;
}
message OnToolErrorArgs {
  string tool_name = 1;
  string error_message = 2;
  string server_name = 4;
  string call_id = 5;
  string trajectory_id = 6;
  uint32 step_index = 7;
}
message PreTurnArgs {
  .antigravity.localharness.UserInput user_input = 1;
  string trajectory_id = 2;
}
message PostTurnArgs {
  string response_text = 1;
  string trajectory_id = 2;
}
message OnCompactionArgs {
  string trajectory_id = 1;
  uint32 step_index = 2;
  string summary = 3;
}
message StopArgs {
  string response_text = 1;
  string trajectory_id = 2;
  int32 continuation_count = 3;
  .antigravity.localharness.TrajectoryStateUpdate.StopReason stop_reason = 4;
  string error_message = 5;
}
message IdleArgs {
  enum Reason {
    REASON_UNSPECIFIED = 0;
    REASON_EXECUTION_COMPLETE = 1;
    REASON_WAITING_FOR_USER_ACTION = 2;
    REASON_MAX_TOKEN_BUDGET_EXCEEDED = 3;
    REASON_MAX_TOOL_CALLS_EXCEEDED = 4;
    REASON_MAX_MODEL_CALLS_EXCEEDED = 5;
    REASON_OUT_OF_BILLING_QUOTA = 6;
    REASON_EXECUTION_CANCELLED = 7;
  }
  string interaction_id = 1;
  string trajectory_id = 2;
  .antigravity.localharness.IdleArgs.Reason reason = 3;
}
message EmptyResult {
}
message OnToolErrorResult {
  string custom_error_message = 1;
