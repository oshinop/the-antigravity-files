  uint64 cached_content_token_count = 5;
  uint64 candidates_token_count = 2;
  uint64 thoughts_token_count = 4;
  uint64 total_token_count = 3;
  string service_tier = 6;
  repeated .antigravity.localharness.ModalityTokenCount prompt_tokens_details = 7;
  repeated .antigravity.localharness.ModalityTokenCount cache_tokens_details = 8;
  repeated .antigravity.localharness.ModalityTokenCount candidates_tokens_details = 9;
  repeated .antigravity.localharness.ModalityTokenCount tool_use_prompt_tokens_details = 10;
}
message McpServerConfig {
  enum AuthProviderType {
    AUTH_PROVIDER_TYPE_UNSPECIFIED = 0;
    AUTH_PROVIDER_TYPE_GOOGLE_CREDENTIALS = 1;
  }
  string name = 1;
  .antigravity.localharness.McpStdioTransport stdio = 2; // oneof=transport
  .antigravity.localharness.McpHttpTransport http = 3; // oneof=transport
  .antigravity.localharness.EgressRpcTransport egress_rpc = 9; // oneof=transport
  repeated string enabled_tools = 4;
  repeated string disabled_tools = 5;
  .antigravity.localharness.McpServerConfig.AuthProviderType auth_provider_type = 6;
  int32 timeout_seconds = 7;
  bool force_all_tools_eager = 10;
}
message McpStdioTransport {
  message EnvEntry {
    string key = 1;
    string value = 2;
  }
  string command = 1;
  repeated string args = 2;
  repeated .antigravity.localharness.McpStdioTransport.EnvEntry env = 3;
}
message McpHttpTransport {
  message HeadersEntry {
    string key = 1;
    string value = 2;
  }
  string url = 1;
  repeated .antigravity.localharness.McpHttpTransport.HeadersEntry headers = 2;
}
message EgressRpcTransport {
  message HeadersEntry {
    string key = 1;
    string value = 2;
  }
  string endpoint_url = 1;
  string proxy_target = 2;
  repeated .antigravity.localharness.EgressRpcTransport.HeadersEntry headers = 3;
  string gal_service_id = 4; // oneof=auth
}
message ActionMcpTool {
